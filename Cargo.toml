[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/imgpipe"

[workspace.dependencies]
imgpipe = { path = "crates/imgpipe", version = "0.1.0" }

serde = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.imgpipe]
opt-level = 2

[workspace.metadata.release]
# The Release workflow commits the version bump, without a signing key.
# sign-commit = true
sign-tag = true
shared-version = true
allow-branch = ["main"]
pre-release-commit-message = "chore: release v{{version}}"
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
