[package]
name = "imgpipe-cli"
version.workspace = true
description = "Command-line tool for imgpipe: run, validate and explain image pipeline files"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["image", "pipeline", "resize", "cli", "batch"]
categories = ["command-line-utilities", "multimedia::images"]

[[bin]]
name = "imgpipe"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
imgpipe = { workspace = true, features = [
    "gif",
    "overlay",
    "png-optimize",
    "schemars",
] }
schemars = "1"
serde.workspace = true
serde_json = "1"
toml = "1"
